<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="background" x1="90" y1="48" x2="940" y2="1000" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".52" stop-color="#F4F1FF"/>
      <stop offset="1" stop-color="#EEE9FF"/>
    </linearGradient>
    <filter id="auroraBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="72"/>
    </filter>
    <linearGradient id="forecast" x1="220" y1="770" x2="796" y2="262" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5B3DF5"/>
      <stop offset=".58" stop-color="#8972F8"/>
      <stop offset="1" stop-color="#86DCC3"/>
    </linearGradient>
    <linearGradient id="shirt" x1="512" y1="388" x2="512" y2="706" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9A87FF"/>
      <stop offset="1" stop-color="#5B3DF5"/>
    </linearGradient>
    <linearGradient id="sun" x1="696" y1="173" x2="798" y2="276" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFD2B8"/>
      <stop offset="1" stop-color="#FFB36F"/>
    </linearGradient>
    <filter id="sunGlow" x="626" y="112" width="240" height="240" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="shirtShadow" x="305" y="335" width="414" height="430" filterUnits="userSpaceOnUse">
      <feGaussianBlur in="SourceAlpha" stdDeviation="13"/>
      <feOffset dy="9"/>
      <feComponentTransfer><feFuncA type="linear" slope=".16"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Pale aurora background uses the app's background and ambient colors. -->
  <rect width="1024" height="1024" fill="url(#background)"/>
  <circle cx="100" cy="102" r="245" fill="#FFD2B8" opacity=".58" filter="url(#auroraBlur)"/>
  <circle cx="971" cy="226" r="250" fill="#CFC6FF" opacity=".72" filter="url(#auroraBlur)"/>
  <circle cx="104" cy="990" r="218" fill="#BFF0DE" opacity=".76" filter="url(#auroraBlur)"/>
  <!-- Full-bleed square: the platform applies its own icon mask. -->
  <!-- Open forecast dial; the sun occupies the opening. -->
  <path d="M278 283 A354 354 0 1 0 746 283" fill="none" stroke="url(#forecast)" stroke-width="30" stroke-linecap="round"/>
  <circle cx="746" cy="260" r="73" fill="#FFC96F" opacity=".28" filter="url(#sunGlow)"/>
  <circle cx="746" cy="260" r="53" fill="url(#sun)"/>
  <!-- Simple, bold garment silhouette for legibility at small sizes. -->
  <g filter="url(#shirtShadow)">
    <path d="M416 393 337 439 388 548 436 525V696H588V525L636 548 687 439 608 393 559 425C545 434 529 441 512 441S479 434 465 425L416 393Z"
      fill="url(#shirt)" stroke="#FFFFFF" stroke-width="18" stroke-linejoin="round"/>
    <path d="M477 421C481 445 494 458 512 458S543 445 547 421" fill="none" stroke="#DCD5FF" stroke-width="9" stroke-linecap="round"/>
  </g>
</svg>
